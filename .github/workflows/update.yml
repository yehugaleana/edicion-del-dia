name: Actualizar noticias

on:
  schedule:
    - cron: "0 */2 * * *"   # cada 2 horas, en UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -q deep-translator
      - name: Descargar feeds
        run: python fetch_news.py
      - name: Guardar cambios
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Actualizar noticias"
          git push
