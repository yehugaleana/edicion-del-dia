<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edición del Día</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #f2f1ec;
    --ink: #1c1c1e;
    --muted: #6b6b63;
    --rule: #1c1c1e;
    --line: rgba(28,28,30,.22);
    --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1a1a1c; --ink: #f2f1ec; --muted: #9a9a92; --rule: #f2f1ec; --line: rgba(242,241,236,.22);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1a1a1c; --ink: #f2f1ec; --muted: #9a9a92; --rule: #f2f1ec; --line: rgba(242,241,236,.22);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .card { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day {
    font-family: var(--serif); font-weight: 800; font-size: clamp(44px, 12vw, 64px);
    line-height: 1; text-align: center; margin: 4px 0 0; text-transform: capitalize;
  }
  .sub {
    text-align: center; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 0;
  }
  .rule { height: 2px; background: var(--rule); border: 0; margin: 0; }
  .label { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .news-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; min-width: 0; }
  .news-item { min-width: 0; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .news-item:nth-last-child(-n+2) { border-bottom: 0; }
  .news-item h3 {
    font-family: var(--serif); font-weight: 700; font-size: 16px; line-height: 1.25;
    margin: 0 0 4px; text-wrap: balance; overflow-wrap: anywhere;
  }
  .news-item .meta { font-size: 11px; color: var(--muted); }
  .news-item a { color: inherit; text-decoration: none; }
  .news-item a:hover { text-decoration: underline; }
  .edition {
    text-align: center; font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--muted); margin: 2px 0 0;
  }
  .note { font-size: 11px; color: var(--muted); text-align: center; margin: 0; }
  @media (max-width: 380px) {
    .news-grid { grid-template-columns: 1fr; }
    .news-item:nth-last-child(-n+2) { border-bottom: 1px solid var(--line); }
    .news-item:last-child { border-bottom: 0; }
  }
</style>

<main class="card" id="app">
  <div class="top"><span id="date">—</span><span id="updated"></span></div>
  <h1 class="day" id="weekday">—</h1>
  <p class="sub" id="edition">Edición del día</p>
  <hr class="rule">

  <section>
    <p class="label" id="newsLabel">En las noticias</p>
    <div class="news-grid" id="news"></div>
  </section>

  <p class="edition" id="edLabel">Edición del día</p>
  <p class="note" id="note"></p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function fillDate() {
    const now = new Date();
    $("date").textContent = now.toLocaleDateString("es-MX", { day: "numeric", month: "short" }).replace(/\.?$/, ".");
    $("weekday").textContent = now.toLocaleDateString("es-MX", { weekday: "long" });
  }

  function render(d) {
    $("edition").textContent = d.edition ?? "";
    $("edLabel").textContent = d.edition ?? "";
    $("newsLabel").textContent = "En las noticias · " + (d.source ?? "");
    $("updated").textContent = d.updated ? "Actualizado " + d.updated : "";
    $("note").textContent = d.note ?? "";
    $("news").innerHTML = (d.news ?? []).map(n =>
      `<article class="news-item"><h3><a href="${esc(n.link || '#')}" target="_blank" rel="noopener">${esc(n.title)}</a></h3><div class="meta">${esc(n.source || '')} · ${esc(n.time)}</div></article>`).join("");
  }

  fillDate();
  fetch("news.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(render)
    .catch(() => render({ edition: "Sin conexión", news: [] }));
</script>
